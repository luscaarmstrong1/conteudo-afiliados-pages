name: Pinterest RSS watchdog
on:
  schedule:
    - cron: '0 */2 * * *'
    - cron: '40 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pinterest-rss-publisher
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and validate missing items
        run: python automation_runtime/cloud_watchdog.py
      - name: Commit only real changes
        run: |
          git add -- sitemap.xml achadinhos-conteudo desenho-manga-conteudo automation_runtime/public_registry.csv automation_runtime/editorial_history.csv
          if git diff --cached --quiet; then
            echo "NOOP: daily feeds already complete"
            exit 0
          fi
          git config user.name "Pinterest RSS Watchdog"
          git config user.email "pinterest-rss-watchdog@users.noreply.github.com"
          git commit -m "Self-heal Pinterest RSS $(TZ=America/Sao_Paulo date +%F)"
          git push origin HEAD:main
